<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09131D"/>
      <stop offset=".55" stop-color="#0D1721"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".075"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".20"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0" stop-color="#818CF8" stop-opacity=".14"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="720" rx="34" fill="url(#bg)"/>
  <ellipse cx="1060" cy="220" rx="330" ry="250" fill="url(#glow)"/>
  <ellipse cx="350" cy="610" rx="280" ry="190" fill="url(#glow2)"/>

  <!-- flagship -->
  <rect x="36" y="36" width="1328" height="370" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".10"/>
  <path d="M84 95 C250 75 390 82 560 83 C800 84 1020 67 1260 95"
        fill="none" stroke="#FFFFFF" stroke-opacity=".055" stroke-width="1"/>

  <!-- route motif -->
  <path d="M820 325 C900 260 930 215 1000 210 C1070 205 1100 145 1220 138"
        fill="none" stroke="url(#blue)" stroke-opacity=".30" stroke-width="2.2"/>
  <circle cx="820" cy="325" r="5" fill="#38BDF8" opacity=".8"/>
  <circle cx="1000" cy="210" r="4" fill="#38BDF8" opacity=".6"/>
  <circle cx="1220" cy="138" r="5" fill="#7DD3FC" opacity=".8"/>

  <text x="80" y="88" fill="#38BDF8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="12" letter-spacing="3">01 / FLAGSHIP PROJECT</text>

  <text x="80" y="168" fill="#F8FAFC"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="42" font-weight="600" letter-spacing="-1.2">SAFEROUTE AI</text>

  <text x="80" y="210" fill="#94A3B8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="16">Context-aware road safety and navigation for Hyderabad.</text>

  <text x="80" y="250" fill="#64748B"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="13">React  ·  FastAPI  ·  Python  ·  PostgreSQL</text>

  <text x="80" y="320" fill="#7DD3FC"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="13" letter-spacing="1.8">EXPLORE PROJECT  ↗</text>

  <!-- two smaller cards -->
  <rect x="36" y="438" width="648" height="236" rx="26" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".09"/>
  <rect x="716" y="438" width="648" height="236" rx="26" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".09"/>

  <!-- civic nodes -->
  <g opacity=".26" stroke="#22D3EE" fill="none">
    <path d="M540 606 L585 570 L625 607 L605 638 L555 640 Z" stroke-width="2"/>
    <circle cx="540" cy="606" r="4" fill="#22D3EE"/>
    <circle cx="585" cy="570" r="4" fill="#22D3EE"/>
    <circle cx="625" cy="607" r="4" fill="#22D3EE"/>
    <circle cx="605" cy="638" r="4" fill="#22D3EE"/>
    <circle cx="555" cy="640" r="4" fill="#22D3EE"/>
  </g>

  <!-- epi waveform -->
  <path d="M1150 625 C1178 595 1192 650 1216 616 C1240 582 1255 655 1278 617 C1300 582 1310 635 1335 603"
        fill="none" stroke="#818CF8" stroke-opacity=".28" stroke-width="2.2"/>

  <text x="74" y="488" fill="#38BDF8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="11" letter-spacing="2.8">02</text>
  <text x="74" y="530" fill="#F8FAFC"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="27" font-weight="600">CIVICPULSE</text>
  <text x="74" y="565" fill="#94A3B8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="14">Civic response platform connecting</text>
  <text x="74" y="587" fill="#94A3B8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="14">citizens, volunteers and coordinators.</text>
  <text x="74" y="630" fill="#64748B"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="12">REACT  ·  FASTAPI  ·  PYTHON</text>
  <text x="595" y="638" text-anchor="end" fill="#7DD3FC"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="12" letter-spacing="1.5">EXPLORE ↗</text>

  <text x="754" y="488" fill="#38BDF8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="11" letter-spacing="2.8">03</text>
  <text x="754" y="530" fill="#F8FAFC"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="27" font-weight="600">EPICAST</text>
  <text x="754" y="565" fill="#94A3B8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="14">Epidemic intelligence and forecasting</text>
  <text x="754" y="587" fill="#94A3B8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="14">platform for monitoring and risk assessment.</text>
  <text x="754" y="630" fill="#64748B"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="12">REACT  ·  FASTAPI  ·  ML</text>
  <text x="1275" y="638" text-anchor="end" fill="#7DD3FC"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="12" letter-spacing="1.5">EXPLORE ↗</text>
</svg>
