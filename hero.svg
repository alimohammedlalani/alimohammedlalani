  <!-- glass panel -->
  <rect x="52" y="44" width="1296" height="452" rx="34" fill="url(#h-glass)" stroke="url(#h-edge)" stroke-width="1.2" filter="url(#h-shadow)"/>
  <path d="M86 90 C255 54 468 70 650 71 C878 71 1088 55 1262 88" fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="1.1"/>
  <g clip-path="url(#h-panelClip)">
    <rect x="52" y="44" width="260" height="452" fill="url(#h-sheen)" class="sheen"/>
  </g>

  <!-- tri-dot accent -->
  <circle cx="104" cy="98" r="4" fill="#5EEAD4" class="dot1"/>
  <circle cx="118" cy="98" r="4" fill="#5EEAD4" class="dot2"/>
  <circle cx="132" cy="98" r="4" fill="#5EEAD4" class="dot3"/>

  <!-- name -->
  <text x="700" y="248" text-anchor="middle" fill="url(#h-text)" filter="url(#h-textShadow)"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',Arial,sans-serif"
        font-size="62" font-weight="650" letter-spacing="-2.2">ALI MOHAMMED LALANI</text>

  <!-- metadata -->
  <text x="700" y="294" text-anchor="middle" fill="#94A3B8" filter="url(#h-textShadow)"
        font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        font-size="13" letter-spacing="3">COMPUTER SCIENCE  ·  ARTIFICIAL INTELLIGENCE</text>

  <!-- divider -->
