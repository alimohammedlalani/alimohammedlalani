  <text x="700" y="95" text-anchor="middle" fill="#5EEAD4" filter="url(#c-textShadow)" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="3">03 / NEXT</text>

