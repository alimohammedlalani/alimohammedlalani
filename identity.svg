<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" width="1400" height="430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A141E"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".06"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="glow" cx="12%" cy="30%" r="70%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="430" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="430" rx="30" fill="url(#glow)"/>
  <rect x="34" y="34" width="1332" height="362" rx="27" fill="#FFFFFF" fill-opacity=".026" stroke="url(#edge)" stroke-width="1.2"/>

  <text x="76" y="84" fill="#38BDF8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="11" letter-spacing="3">01 / IDENTITY</text>

  <text x="76" y="150" fill="#F8FAFC"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="31" font-weight="500" letter-spacing="-.6">
    Computer Science &amp; Artificial Intelligence student
  </text>
  <text x="76" y="190" fill="#F8FAFC"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="31" font-weight="500" letter-spacing="-.6">
    building real software and going deeper into AI/ML.
  </text>

  <rect x="76" y="228" width="1248" height="1" fill="#FFFFFF" fill-opacity=".065"/>
  <rect x="700" y="258" width="1" height="108" fill="url(#edge)"/>

  <text x="76" y="280" fill="#38BDF8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="11" letter-spacing="2.5">SOFTWARE ENGINEERING</text>
  <text x="76" y="316" fill="#94A3B8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="15">Full-stack applications, APIs, and systems</text>
  <text x="76" y="340" fill="#94A3B8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="15">built to work beyond the screen.</text>

  <text x="744" y="280" fill="#38BDF8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="11" letter-spacing="2.5">AI / ML</text>
  <text x="744" y="316" fill="#94A3B8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="15">Stronger foundations in machine learning</text>
  <text x="744" y="340" fill="#94A3B8"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
        font-size="15">and intelligent systems.</text>
</svg>
